
{% extends "base.html" %}

{% block content %}
<div class="card">
    <h1>Login</h1>

    {% if form.errors %}
        <p class="error">
            Your username or password is incorrect. Please try again.
        </p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <input type="hidden" name="next" value="{{ next }}">

        <button type="submit">Log In</button>
    </form>
</div>
{% endblock %}
